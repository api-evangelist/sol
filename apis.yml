name: Sol
description: 'Sol Reader is a wearable e-reader — marketed as the world''s first wearable e-reader
  — built by Sol and backed by Initialized Capital. The device is a lightweight (104g) headset with dual
  1.3" 271ppi side-lit E Ink displays, adjustable diopter optics and IPD, a handheld remote, and 25+ hours
  of battery for a distraction-free reading experience. It reads a connected Kindle library and DRM-free
  EPUB uploads, offers the Sol Store with over one million titles, plus AI question-answering and an
  AutoPilot speed-reading mode. Sol is a consumer hardware company; it publishes no public developer API,
  SDK, or developer portal at this time.'
